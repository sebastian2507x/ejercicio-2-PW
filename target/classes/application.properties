spring.application.name=login

server.port=8080

# ---- Base de datos MySQL local ----
# para que sirva el proyecto cambiar el usuario y contraseña del MYSQL local
spring.datasource.url=jdbc:mysql://localhost:3306/securitydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
#crea las tablas que falten (users, roles, users_roles, producto)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- Vistas JSP ----
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
